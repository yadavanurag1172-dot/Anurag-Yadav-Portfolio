<script>
  function openStaticLightbox(src, title) {
    const lightbox = document.getElementById('staticLightbox');
    const img = document.getElementById('staticLightboxImg');
    const label = document.getElementById('staticLightboxTitle');

    img.src = src;
    img.alt = title;
    label.textContent = title;

    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeStaticLightbox() {
    const lightbox = document.getElementById('staticLightbox');
    const img = document.getElementById('staticLightboxImg');

    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () {
      img.src = '';
    }, 300);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeStaticLightbox();
  });

  document.getElementById('staticLightbox').addEventListener('click', function (e) {
    if (e.target.id === 'staticLightbox') closeStaticLightbox();
  });
</script>
